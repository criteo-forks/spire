name: Publish SPIRE server image

on:
  push:
    branches: [main, serial-selector]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'criteo-forks/spire'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # These images are unsigned. Upstream release signing remains separate.
      - name: Build, push, and verify server image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/spire-server:sha-${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "goversion=$(cat .go-version)" \
            --target spire-server \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" \
            --push .
          docker run --rm --entrypoint /opt/spire/bin/spire-server "$image" -version
          docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
